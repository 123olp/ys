name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVACY_REPORT_MODE: ci
      PRIVACY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Run privacy preflight
        run: python tools/audit_repository_privacy.py --scope all --revision "$PRIVACY_REVISION" --report-mode ci

      - name: Enforce public product-source boundary
        run: python tools/audit_public_product_boundary.py

      - name: Install check dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run local checks
        run: make check
