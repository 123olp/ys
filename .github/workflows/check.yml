name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRIVACY_REPORT_MODE: ci
      PRIVACY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Run privacy preflight
        run: python tools/audit_repository_privacy.py --scope all --revision "$PRIVACY_REVISION" --report-mode ci

      - name: Enforce public product-source boundary
        run: python tools/audit_public_product_boundary.py

      - name: Install check dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run local checks
        run: make check
