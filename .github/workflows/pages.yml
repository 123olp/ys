name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "web/**"
      - "domains/_possibility-space-control/classification.tsv"
      - "docs/reference/human-infra-maturity-gap-register.json"
      - "docs/reference/human-infra-domain-claim-evidence-matrix.json"
      - "docs/reference/human-infra-domain-falsifier-coverage.json"
      - "docs/reference/human-infra-domain-source-card-field-extraction.json"
      - "docs/reference/human-infra-falsifier-source-card-backfill.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Build and audit the Pages publication
        working-directory: web
        run: npm run audit:geo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
