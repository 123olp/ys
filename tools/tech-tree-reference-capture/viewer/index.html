<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Infra · 科技树候选浏览器</title>
  <style>
    :root { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #18222c; background: #eef1f4; letter-spacing: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    .app { display: grid; grid-template-rows: 56px minmax(0, 1fr); min-height: 100vh; }
    header { display: flex; align-items: center; gap: 18px; padding: 0 18px; border-bottom: 1px solid #c7cdd4; background: #fff; }
    header strong { white-space: nowrap; font-size: 15px; }
    #summary { color: #69737d; font-size: 13px; }
    .layout { display: grid; grid-template-columns: minmax(230px, 290px) minmax(420px, 1fr) minmax(260px, 330px); min-height: 0; }
    aside, main { min-width: 0; min-height: 0; }
    .sidebar { display: grid; grid-template-rows: auto minmax(0, 1fr); border-right: 1px solid #c7cdd4; background: #f8f9fa; }
    .filter { padding: 12px; border-bottom: 1px solid #d8dde2; }
    .filter input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid #b8c0c8; border-radius: 4px; background: #fff; }
    .candidate-list { overflow: auto; padding: 6px; }
    .candidate { width: 100%; padding: 10px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .candidate:hover { background: #e8edf1; }
    .candidate[aria-current="true"] { border-color: #7493ad; background: #dfeaf2; }
    .candidate-title { display: block; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .candidate-category { display: block; margin-top: 4px; color: #66717c; font-size: 12px; }
    .preview { display: grid; grid-template-rows: 46px minmax(0, 1fr); background: #fff; }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid #c7cdd4; }
    .toolbar button, .toolbar a { min-height: 30px; padding: 5px 10px; border: 1px solid #aeb7c0; border-radius: 4px; background: #fff; color: #24313d; text-decoration: none; cursor: pointer; }
    .toolbar button:hover, .toolbar a:hover { background: #edf2f5; }
    .toolbar .primary { border-color: #315f7d; background: #315f7d; color: #fff; }
    #toolbar-status { min-width: 0; margin-left: auto; overflow: hidden; color: #69737d; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .details { overflow: auto; padding: 18px; border-left: 1px solid #c7cdd4; background: #f8f9fa; }
    h1 { margin: 0 0 4px; font-size: 20px; line-height: 1.35; }
    h2 { margin: 20px 0 8px; font-size: 13px; text-transform: uppercase; }
    .score { display: inline-flex; align-items: baseline; gap: 3px; margin: 4px 0 18px; color: #205f45; font-size: 30px; font-weight: 720; }
    .score small { color: #66717c; font-size: 13px; font-weight: 500; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; list-style: none; }
    .tag-list li { padding: 4px 7px; border: 1px solid #c3cad1; border-radius: 4px; background: #fff; font-size: 12px; }
    .boundary { padding: 9px 10px; border-left: 3px solid #8a5a20; background: #f2ece4; color: #533817; font-size: 13px; line-height: 1.55; }
    .empty { padding: 18px; color: #66717c; font-size: 13px; }
    @media (max-width: 980px) { .layout { grid-template-columns: 240px minmax(0, 1fr); } .details { display: none; } }
    @media (max-width: 680px) { .layout { grid-template-columns: 1fr; grid-template-rows: 220px minmax(480px, 1fr); } .sidebar { border-right: 0; border-bottom: 1px solid #c7cdd4; } header { padding: 0 12px; } #summary { display: none; } }
  </style>
</head>
<body>
  <div class="app">
    <header><strong>Human Infra · 科技树候选浏览器</strong><span id="summary">正在读取候选清单...</span></header>
    <div class="layout">
      <aside class="sidebar">
        <div class="filter"><input id="search" type="search" placeholder="搜索名称、类别或模式" aria-label="搜索候选"></div>
        <nav class="candidate-list" id="candidate-list" aria-label="候选网站"></nav>
      </aside>
      <main class="preview">
        <div class="toolbar">
          <button type="button" id="reload">刷新</button>
          <a class="primary" id="open-external" target="_blank" rel="noopener noreferrer">新窗口打开</a>
          <span id="toolbar-status">部分站点会禁止第三方内嵌</span>
        </div>
        <iframe id="preview-frame" title="候选网站预览" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </main>
      <aside class="details" id="details" aria-live="polite"></aside>
    </div>
  </div>
  <script>
    const manifestUrl = "/docs/reference/tech-tree-web-candidates/candidates.json";
    const state = { candidates: [], filtered: [], selectedId: null };
    const list = document.querySelector("#candidate-list");
    const frame = document.querySelector("#preview-frame");
    const details = document.querySelector("#details");
    const search = document.querySelector("#search");
    const external = document.querySelector("#open-external");
    const status = document.querySelector("#toolbar-status");
    const summary = document.querySelector("#summary");

    function escapeHtml(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function renderList() {
      if (!state.filtered.length) {
        list.innerHTML = '<p class="empty">没有匹配的候选。</p>';
        return;
      }
      list.innerHTML = state.filtered.map((candidate) => `
        <button class="candidate" type="button" data-id="${escapeHtml(candidate.id)}" aria-current="${candidate.id === state.selectedId}">
          <span class="candidate-title">${escapeHtml(candidate.name)}</span>
          <span class="candidate-category">${escapeHtml(candidate.category)} · ${candidate.fit_score}/100</span>
        </button>`).join("");
    }
    function renderDetails(candidate) {
      const tags = (items) => items.map((item) => `<li>${escapeHtml(item)}</li>`).join("");
      details.innerHTML = `
        <h1>${escapeHtml(candidate.name)}</h1><div>${escapeHtml(candidate.category)}</div>
        <div class="score">${candidate.fit_score}<small>/ 100 适配度</small></div>
        <h2>建议复用</h2><ul class="tag-list">${tags(candidate.adopt)}</ul>
        <h2>避免照搬</h2><ul class="tag-list">${tags(candidate.avoid)}</ul>
        <h2>许可边界</h2><p class="boundary">${escapeHtml(candidate.license_boundary)}</p>`;
    }
    function selectCandidate(id) {
      const candidate = state.candidates.find((item) => item.id === id);
      if (!candidate) return;
      state.selectedId = id;
      frame.src = candidate.url;
      external.href = candidate.url;
      status.textContent = candidate.url;
      renderList();
      renderDetails(candidate);
      history.replaceState(null, "", `#${encodeURIComponent(id)}`);
    }
    list.addEventListener("click", (event) => {
      const button = event.target.closest("[data-id]");
      if (button) selectCandidate(button.dataset.id);
    });
    search.addEventListener("input", () => {
      const query = search.value.trim().toLocaleLowerCase();
      state.filtered = state.candidates.filter((candidate) =>
        [candidate.name, candidate.category, ...candidate.adopt].join(" ").toLocaleLowerCase().includes(query));
      renderList();
    });
    document.querySelector("#reload").addEventListener("click", () => { if (frame.src) frame.src = frame.src; });
    const inlineManifest = document.querySelector("#candidate-manifest");
    const manifestPromise = inlineManifest
      ? Promise.resolve(JSON.parse(inlineManifest.textContent))
      : fetch(manifestUrl).then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        });

    manifestPromise.then((manifest) => {
      state.candidates = manifest.candidates;
      state.filtered = manifest.candidates;
      summary.textContent = `${manifest.candidates.length} 个候选 · 左侧选择 · 中间预览 · 右侧评估`;
      const requested = decodeURIComponent(location.hash.slice(1));
      selectCandidate(state.candidates.some((item) => item.id === requested) ? requested : state.candidates[0].id);
    }).catch((error) => {
      summary.textContent = "候选清单加载失败";
      list.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
    });
  </script>
</body>
</html>
