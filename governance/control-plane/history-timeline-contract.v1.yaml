  created: 2026-08-06
  last_reviewed: 2026-08-07
  review_cycle: P90D
  status: active
spec:
  source_of_truth:
    schema: docs/reference/history-timeline/timeline.schema.json
    sources_schema: docs/reference/history-timeline/sources.schema.json
    periods_schema: docs/reference/history-timeline/periods.schema.json
    example: docs/reference/history-timeline/example-events.json
    timeline_data: docs/reference/history-timeline/timeline.json
    source_registry: docs/reference/history-timeline/sources.json
    period_registry: docs/reference/history-timeline/periods.json
    works_subset_schema: docs/reference/history-timeline/works-subset.schema.json
    works_subset: docs/reference/history-timeline/works-subset.v1.json
    works_review_register_schema: docs/reference/history-timeline/works-review-register.schema.json
    works_review_register: docs/reference/history-timeline/works-review-register.v1.json
    publication_manifest_schema: docs/reference/history-timeline/publication-manifest.schema.json
    publication_manifest: docs/reference/history-timeline/publication-manifest.v1.json
    publication_architecture: docs/reference/history-timeline/PUBLICATION.md
    preview_script: docs/reference/history-timeline/preview.js
    preview_core: docs/reference/history-timeline/preview-core.js
    echarts_runtime: docs/reference/history-timeline/echarts.common.min.js
    event_table: docs/reference/history-timeline/timeline-events.psql.txt
    timelinejs_data: docs/reference/history-timeline/timelinejs.json
    timelinejs_light_data: docs/reference/history-timeline/timelinejs.light.json
    timelinejs_detail_data: docs/reference/history-timeline/timelinejs.detail.json
