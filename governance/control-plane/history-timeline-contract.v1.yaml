    - docs/reference/history-timeline/timelinejs.json
    - docs/reference/history-timeline/timelinejs.light.json
    - docs/reference/history-timeline/timelinejs.detail.json
    - docs/reference/history-timeline/preview.html
    - tools/test_history_timeline_core.js
  commands:
    validate: make history-timeline-gate
    core_test: make history-timeline-core-test
    quality_audit: make history-timeline-quality-audit
    validator: python3 tools/validate_history_timeline.py
    preview: make history-timeline-preview
    browser_gate: make history-timeline-browser-gate
  gates:
    - id: GATE-0002
      severity: BLOCK
      detectability: automated
      purpose: 年表必须通过机器契约校验
    - id: GATE-0003
      severity: BLOCK
      detectability: manual
      purpose: 年表事件必须完成来源与审阅连续性
  identity:
    event_id_pattern: "^HIT-[A-Z]{3}-[0-9]{3,}$"
    source_id_pattern: "^SRC-[0-9]{3,}$"
    timeline_id_pattern: "^HITL-[A-Z0-9-]+$"
  lifecycle:
    - draft
    - locally_reviewed
    - fresh_reviewed
    - published
    - needs_revision
    - blocked
    - superseded
    - archived
  prohibited_uses:
    - 把神话、文学或思想事件写成已验证史实
    - 把动物实验、细胞实验或远期预测写成人体有效结论
    - 把年表事件直接作为医疗、投资、法律或政策建议
    - 删除来源、隐藏争议或把待考证升级为已证明
    - 使用未复核事件进入公共永生史正文
